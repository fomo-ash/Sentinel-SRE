[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sre"
version = "0.1.0"
description = "AI incident investigation with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.18,<1.3",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
llm = ["langchain>=1.4.7,<1.5"]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

